name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CubaFlightWidget-progetto.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o CubaFlightWidget-progetto.zip

      - name: Fix widget description
        run: sed -i '/android:description=/d' CubaFlightWidget/app/src/main/res/xml/cuba_flight_widget_info.xml
      - name: Build APK
        run: gradle -p CubaFlightWidget assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: CubaFlightWidget-APK
          path: CubaFlightWidget/app/build/outputs/apk/debug/*.apk
